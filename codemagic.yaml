# Codemagic — build iOS de SGS Móvil (Expo) y subida a App Store Connect / TestFlight.
# La app es Expo "managed" con un módulo nativo local (bodycamhd, solo Android):
# en iOS NO se compila. El flujo hace `expo prebuild` (genera ios/), pods, firma
# con tu key de App Store Connect (firma automática) y publica a TestFlight.
#
# Requisitos en Codemagic (una vez) — sirve para cuenta PERSONAL (sin integración
# con nombre): la API key de App Store Connect se pasa por VARIABLES.
#  1) La app debe existir en App Store Connect con el bundle id com.sgs.movil.
#  2) Environment group `sgs_ios` (App settings → Environment variables) con:
#       # App Store Connect API key (firma + subida a TestFlight):
#       APP_STORE_CONNECT_ISSUER_ID      = Issuer ID
#       APP_STORE_CONNECT_KEY_IDENTIFIER = Key ID
#       APP_STORE_CONNECT_PRIVATE_KEY    = contenido COMPLETO del .p8 (Secure)
#       # Runtime de la app (se inyectan en el bundle al compilar):
#       EXPO_PUBLIC_TURN_URL, EXPO_PUBLIC_TURN_USERNAME, EXPO_PUBLIC_TURN_CREDENTIAL
#       EXPO_PUBLIC_TOMTOM_API_KEY (opcional)
#     (Supabase URL/anon tienen fallback en el código.)

workflows:
  ios-testflight:
    name: SGS Móvil — iOS (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      groups:
        - sgs_ios
      vars:
        BUNDLE_ID: "com.sgs.movil"
      node: 20
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $CM_BUILD_DIR/mobile/node_modules
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Instalar dependencias (npm)
        script: npm ci

      - name: Expo prebuild (iOS)
        script: npx expo prebuild --platform ios --clean

      - name: Ajustar entitlement NFC (Apple rechaza NDEF con el SDK nuevo — ITMS-90778)
        script: |
          set -e
          # El plugin de react-native-nfc-manager agrega el formato 'NDEF', que Apple
          # rechaza (SDK 26.x). Los rondines leen el UID de la etiqueta => basta 'TAG'.
          # Dejamos el entitlement solo con TAG (arregla el upload, conserva NFC en iOS).
          ENT=$(ls ios/*/*.entitlements 2>/dev/null | head -1)
          echo "Entitlements: $ENT"
          KEY="com.apple.developer.nfc.readersession.formats"
          if [ -n "$ENT" ] && /usr/libexec/PlistBuddy -c "Print :$KEY" "$ENT" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$ENT"
            /usr/libexec/PlistBuddy -c "Add :$KEY array" "$ENT"
            /usr/libexec/PlistBuddy -c "Add :$KEY:0 string TAG" "$ENT"
            echo "NFC entitlement -> [TAG]"
          else
            echo "No hay entitlement NFC que ajustar."
          fi
          [ -n "$ENT" ] && /usr/libexec/PlistBuddy -c "Print" "$ENT" || true

      - name: CocoaPods
        script: cd ios && pod install

      - name: Firma automática (App Store Connect API key)
        script: |
          keychain initialize
          # Usa una llave privada propia (CERTIFICATE_PRIVATE_KEY) para crear/gestionar
          # el certificado de distribución; así Codemagic siempre tiene la llave.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Solo el proyecto de la app (no los .xcodeproj de node_modules/pods).
          xcode-project use-profiles --project "ios/*.xcodeproj"

      - name: Número de build (CFBundleVersion = build de Codemagic)
        script: |
          cd ios && agvtool new-version -all "$BUILD_NUMBER"

      - name: Compilar IPA
        script: |
          set -e
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          # El scheme de la app que genera Expo = nombre del proyecto (= basename del
          # workspace). NO usar schemes[0] (puede ser un pod como EXApplication).
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE · Scheme: $SCHEME"

          # --- Genera export_options.plist VALIDO para Xcode 16 (method
          #     'app-store-connect', firma manual, teamID + perfil reales). ---
          # Xcode 16 guarda los perfiles en UserData; versiones previas en MobileDevice.
          PP=""; APPID=""
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            [ -d "$d" ] || continue
            for f in "$d/"*.mobileprovision "$d/"*.provisionprofile; do
              [ -e "$f" ] || continue
              security cms -D -i "$f" > /tmp/pp.plist 2>/dev/null || continue
              A=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/pp.plist 2>/dev/null || echo "")
              case "$A" in *".$BUNDLE_ID") cp /tmp/pp.plist /tmp/pp_match.plist; PP="/tmp/pp_match.plist"; APPID="$A"; break 2;; esac
            done
          done
          TEAM_ID="${APPID%%.*}"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PP" 2>/dev/null || echo "")
          echo "Team: $TEAM_ID · Profile: $PROFILE_NAME · AppID: $APPID"
          if [ -z "$TEAM_ID" ] || [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: no se encontro el provisioning profile para $BUNDLE_ID."; exit 1
          fi

          P="$HOME/export_options.plist"
          rm -f "$P"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$P"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$P"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$P"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$P"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$P"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$P"
          plutil -lint "$P"

          # build-ipa de esta version de codemagic-cli-tools NO reconoce el method
          # 'app-store-connect' (Xcode 16) y rechaza el plist. Archivamos y exportamos
          # con xcodebuild directo, que si lo acepta. La firma ya la configuro
          # use-profiles (manual, con el perfil correcto) en el .xcodeproj.
          rm -rf build/ios
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -archivePath build/ios/App.xcarchive -destination "generic/platform=iOS" \
            clean archive
          xcodebuild -exportArchive -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist "$P"
          echo "--- IPA generado ---"; ls -la build/ios/ipa
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
